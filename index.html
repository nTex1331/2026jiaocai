<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026级教材汇总工具</title>
<style>
:root{
  --accent:#3b5bdb; --accent-2:#2f3f8f; --accent-soft:#eef1fe;
  --border:#e3e6ef; --bg:#f4f5fa; --card:#ffffff;
  --text:#1c2333; --muted:#6b7280; --ok:#16a34a; --warn:#d97706;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
}
header{
  padding:16px 24px; color:#fff;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
header h1{margin:0; font-size:19px; font-weight:700}
header .sub{font-size:12px; opacity:.85; margin-left:auto}
.wrap{display:grid; grid-template-columns:400px 1fr; gap:16px; padding:16px; align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:0 1px 3px rgba(20,30,60,.05)}
.card h2{margin:0 0 10px; font-size:15px; color:var(--accent-2)}
.sel-panel{position:sticky; top:16px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.btn{
  border:1px solid var(--border); background:#fff; color:var(--text);
  padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; transition:.15s;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.search{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-bottom:10px}
.search:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.major-list{max-height:52vh; overflow:auto; border:1px solid var(--border); border-radius:8px}
.major-row{
  display:flex; align-items:center; gap:8px; padding:7px 10px; cursor:pointer;
  border-bottom:1px solid #f0f1f6; transition:background .12s;
}
.major-row:last-child{border-bottom:none}
.major-row:hover{background:var(--accent-soft)}
.major-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:none}
.m-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.badge{
  font-size:11px; color:var(--muted); background:#f0f1f6; border-radius:20px; padding:2px 8px; flex:none;
}
.qty{
  width:62px; padding:4px 6px; border:1px solid var(--border); border-radius:6px;
  font-size:13px; text-align:center; flex:none;
}
.qty:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.qty:disabled{background:#f4f5f8}
.stat-line{font-size:12px; color:var(--muted); margin:8px 2px 0; line-height:1.7}
.stat-line b{color:var(--accent)}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
.summary-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px}
@media(max-width:640px){.summary-cards{grid-template-columns:repeat(2,1fr)}}
.s-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px}
.s-card .v{font-size:22px; font-weight:700; color:var(--accent)}
.s-card .k{font-size:12px; color:var(--muted); margin-top:2px}
.table-box{overflow:auto; max-height:65vh; border:1px solid var(--border); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:900px}
thead th{
  position:sticky; top:0; background:#f0f2f9; z-index:2; text-align:left;
  padding:9px 10px; font-weight:600; color:var(--accent-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:8px 10px; border-bottom:1px solid #f0f1f6; vertical-align:top}
tbody tr:nth-child(even){background:#fafbfe}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:center; white-space:nowrap}
.t-total{font-weight:700; color:var(--accent)}
.remark{font-size:11px; color:var(--warn); white-space:nowrap}
.major-detail{width:100%; border:1px solid var(--border); border-radius:10px; margin-top:10px; overflow:hidden}
.major-detail summary{
  cursor:pointer; padding:10px 14px; background:#f0f2f9; font-weight:600; color:var(--accent-2);
  display:flex; gap:10px; align-items:center; font-size:13px;
}
.major-detail summary .d-badge{margin-left:auto; font-weight:400; color:var(--muted); font-size:12px}
.major-detail .inner{padding:10px 14px; overflow:auto}
.major-detail table{min-width:700px}
.empty{color:var(--muted); text-align:center; padding:40px 0}
.hint{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.8}
footer{padding:14px 24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); margin-top:8px}
@media print{
  .sel-panel, .actions, header .sub, .btn, footer, .search, .toolbar, .major-detail summary{display:none !important}
  body{background:#fff}
  .wrap{display:block; padding:0}
  .card{border:none; box-shadow:none; padding:0}
  .table-box{max-height:none; border:none}
  .major-detail{page-break-inside:avoid}
  .major-detail .inner{display:block !important}
}
</style>
</head>
<body>

<header>
  <h1>📚 2026级教材汇总工具</h1>
  <span class="sub">数据来源：教材目录.xls（仅 2026 级 · 2026-2027 第1学期）</span>
</header>

<div class="wrap">

  <!-- ============ 左侧：专业选择 ============ -->
  <div class="card sel-panel">
    <h2>① 勾选专业与数量</h2>
    <div class="toolbar">
      <button class="btn" id="btnAll">全选</button>
      <button class="btn" id="btnNone">清空</button>
      <button class="btn" id="btnInvert">反选</button>
    </div>
    <input class="search" id="search" type="text" placeholder="🔍 搜索专业…">
    <div class="major-list" id="majorList"></div>
    <div class="stat-line" id="statLine">尚未选择专业</div>
  </div>

  <!-- ============ 右侧：汇总结果 ============ -->
  <div class="card">
    <h2>② 生成汇总</h2>
    <div class="actions">
      <button class="btn primary" id="btnGen">生成汇总表</button>
      <button class="btn" id="btnCsv" disabled>导出 CSV</button>
      <button class="btn" id="btnPrint" disabled>打印</button>
    </div>
    <div id="result">
      <div class="empty">👈 在左侧勾选专业（数量默认=班级数，可改），然后点「生成汇总表」</div>
    </div>
  </div>

</div>

<footer>
  提示：每个专业一栏「数量」，指该专业每本教材需要多少册，默认等于班级数（每班 1 套）；同名教材跨专业自动合并统计。页面可离线使用，导出 CSV 可用 Excel 直接打开。
</footer>

,"I9787569720204","I9787572625930","I讲义"]},"税收学（本）":{"classes":2,"books":["I9771674678260","I9787040599022","I9787115621061","I9787115673145","I9787313284938","I9787313287557","I9787513048750","I9787516236024","I9787516537541","I9787516537572","I9787521343083","I9787544675031","I9787544683647","I9787565452314","I9787568576229","I9787569078817"]},"体能训练（本）":{"classes":5,"books":["I9771674678260","I9787040419221","I9787040599022","I9787115628312","I9787513048750","I9787516236024","I9787562497714","I9787568520867","I9787568532556","I9787568537919","I9787576021134","I9787576059045","I讲义"]},"网络与新媒体（本）":{"classes":3,"books":["I9771674678260","I9787040599022","I9787115414618","I9787115621061","I9787115631534","I9787513048750","I9787516236024","I9787521343083","I9787544675031","I9787544683647","I9787568576229","I9787569078817","I讲义"]},"文化产业管理（本）":{"classes":3,"books":["I9771674678260","I9787040599022","I9787040635881","I9787313284938","I9787313287557","I9787503273162","I9787513048750","I9787516236024","I9787516537541","I9787516537572","I9787521343083","I9787544675031","I9787544683647","I9787562497714","I9787568576229","I9787569078817"]},"物流工程（本）":{"classes":1,"books":["I9771674678260","I9787040599022","I9787040635881","I9787115588487","I9787115591098","I9787115621030","I9787115621061","I9787115621597","I9787513048750","I9787516236024","I9787518447930","I9787521343083","I9787544675031","I9787544683647","I9787568576229","I9787569078817"]},"物业管理（本）":{"classes":3,"books":["I9771674678260","I9787040599022","I9787040635881","I9787112313631","I9787313284938","I9787313287557","I9787513048750","I9787516236024","I9787516537541","I9787516537572","I9787521343083","I9787544675031","I9787544683647","I9787562497714","I9787568576229","I9787569078817"]},"信息管理与信息系统（本）":{"classes":2,"books":["I9771674678260","I9787040599022","I9787040635881","I9787115588487","I9787115591098","I9787115621030","I9787115621061","I9787115621597","I9787302460459","I9787513048750","I9787516236024","I9787521343083","I9787544675031","I9787544683647","I9787568576229","I9787569078817","I讲义"]},"休闲体育（本）":{"classes":5,"books":["I9771674678260","I9787040419221","I9787040599022","I9787040627756","I9787040646689","I9787302657231","I9787513048750","I9787516236024","I9787562497714","I9787564414092","I9787568520867","I9787568532556","I9787568537919","I9787576059045","I讲义"]},"应用中文（本）":{"classes":1,"books":["I9771674678260","I9787040316230","I9787040599022","I9787040667233","I9787040671490","I9787207135544","I9787513048750","I9787516236024","I9787521343083","I9787544675031","I9787544683647","I9787562497714","I9787568576229","I9787569078817"]},"英语（本）":{"classes":5,"books":["I9771674678260","I9787040581690","I9787040599022","I9787115673145","I9787513048750","I9787516236024","I9787544671965","I9787544672139","I9787544677790","I9787544678292","I9787544680233","I9787568576229"]},"养老服务管理（本）":{"classes":2,"books":["I9771674678260","I9787040599022","I9787117366106","I9787513048750","I9787516236024","I9787548764526","I9787562497714","I9787568520867","I9787568532556","I9787568537919","I9787568576229","I讲义"]}}};

const state = {};        // 专业名 -> 数量
let filter = '';
let order = [];          // 专业显示顺序（拼音排序）
for (const m of Object.keys(MAJORS.majors)) state[m] = MAJORS.majors[m].classes;
order = Object.keys(MAJORS.majors).sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 专业列表 ---------- */
function renderMajors(){
  const list = $('majorList');
  const kw = filter.trim();
  let html = '';
  let selCount = 0, clsSum = 0, copySum = 0;
  for (const m of order){
    const meta = MAJORS.majors[m];
    const qty = state[m];
    if (kw && !m.includes(kw)) continue;
    if (qty > 0) { selCount++; clsSum += meta.classes; copySum += qty * meta.books.length; }
    html += `<label class="major-row">
      <input type="checkbox" data-m="${esc(m)}" ${qty>0?'checked':''}>
      <span class="m-name" title="${esc(m)}">${esc(m)}</span>
      <span class="badge">${meta.classes}班</span>
      <input class="qty" type="number" min="0" step="1" value="${qty}" data-m="${esc(m)}" ${qty>0?'':'disabled'}>
    </label>`;
  }
  list.innerHTML = html || '<div class="empty" style="padding:20px">无匹配专业</div>';
  $('statLine').innerHTML = selCount
    ? `已选 <b>${selCount}</b> 个专业（<b>${clsSum}</b> 个班），按默认数量预计 <b>${copySum}</b> 册`
    : '尚未选择专业';
  $('btnGen').disabled = selCount === 0;
}

$('majorList').addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox'){
    const m = t.dataset.m;
    state[m] = t.checked ? MAJORS.majors[m].classes : 0;
    renderMajors();
  } else if (t.classList.contains('qty')){
    const m = t.dataset.m;
    state[m] = Math.max(0, parseInt(t.value) || 0);
    renderMajors();
  }
});
$('search').addEventListener('input', e => { filter = e.target.value; renderMajors(); });
$('btnAll').onclick = () => { for (const m of order) state[m] = MAJORS.majors[m].classes; renderMajors(); };
$('btnNone').onclick = () => { for (const m of order) state[m] = 0; renderMajors(); };
$('btnInvert').onclick = () => { for (const m of order) state[m] = state[m] > 0 ? 0 : MAJORS.majors[m].classes; renderMajors(); };

/* ---------- 汇总 ---------- */
function buildSummary(){
  const sel = order.filter(m => state[m] > 0);
  if (!sel.length) return null;
  const bookMap = new Map();   // key -> 合并条目
  for (const m of sel){
    const meta = MAJORS.majors[m];
    const qty = state[m];
    for (const key of meta.books){
      let b = bookMap.get(key);
      if (!b){
        const src = MAJORS.books.find(x => x.key === key);
        b = { ...src, majors: [], total: 0 };
        bookMap.set(key, b);
      }
      b.majors.push({m, qty});
      b.total += qty;
    }
  }
  return [...bookMap.values()].sort((a,b)=> b.total - a.total || a.name.localeCompare(b.name,'zh-Hans-CN'));
}

function renderResult(){
  const sel = order.filter(m => state[m] > 0);
  const summary = buildSummary();
  const box = $('result');
  const noCsv = sel.length === 0 || !summary;
  $('btnCsv').disabled = noCsv;
  $('btnPrint').disabled = noCsv;
  if (!summary){
    box.innerHTML = '<div class="empty">👈 在左侧勾选专业，然后点「生成汇总表」</div>';
    return;
  }
  const clsSum = sel.reduce((s,m)=>s+MAJORS.majors[m].classes,0);
  const copySum = summary.reduce((s,b)=>s+b.total,0);

  // 汇总卡片
  let html = `<div class="summary-cards">
    <div class="s-card"><div class="v">${sel.length}</div><div class="k">已选专业</div></div>
    <div class="s-card"><div class="v">${clsSum}</div><div class="k">涉及班级</div></div>
    <div class="s-card"><div class="v">${summary.length}</div><div class="k">教材种类</div></div>
    <div class="s-card"><div class="v">${copySum}</div><div class="k">合计册数</div></div>
  </div>`;

  // 汇总表
  html += `<div class="table-box"><table>
    <thead><tr>
      <th class="num">#</th><th>教材名称</th><th>作者</th><th>出版社</th><th>ISBN</th>
      <th>课程</th><th>备注</th><th>专业 × 数量</th><th class="num">合计</th>
    </tr></thead><tbody>`;
  summary.forEach((b,i)=>{
    const detail = b.majors.map(x=>`${esc(x.m)}×${x.qty}`).join('；');
    html += `<tr>
      <td class="num">${i+1}</td>
      <td>${esc(b.name)}</td>
      <td>${esc(b.author)||'—'}</td>
      <td>${esc(b.pub)||'—'}</td>
      <td>${esc(b.isbn)||'—'}</td>
      <td>${esc(b.courses.join('、'))||'—'}</td>
      <td class="remark">${esc(b.remark)||''}</td>
      <td>${detail}</td>
      <td class="num t-total">${b.total}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  // 分专业明细
  html += '<div style="margin-top:14px">';
  sel.forEach(m=>{
    const meta = MAJORS.majors[m];
    const qty = state[m];
    const keys = [...meta.books].sort((a,b)=>{
      const na = MAJORS.books.find(x=>x.key===a).name, nb = MAJORS.books.find(x=>x.key===b).name;
      return na.localeCompare(nb,'zh-Hans-CN');
    });
    let rows = '';
    keys.forEach((k,i)=>{
      const b = MAJORS.books.find(x=>x.key===k);
      rows += `<tr>
        <td class="num">${i+1}</td><td>${esc(b.name)}</td>
        <td>${esc(b.author)||'—'}</td><td>${esc(b.pub)||'—'}</td>
        <td>${esc(b.isbn)||'—'}</td><td>${esc(b.courses.join('、'))||'—'}</td>
        <td class="num t-total">${qty}</td>
      </tr>`;
    });
    html += `<details class="major-detail">
      <summary>${esc(m)}<span class="d-badge">${meta.classes}个班 · ${keys.length}种书 × ${qty}册</span></summary>
      <div class="inner"><table>
        <thead><tr><th class="num">#</th><th>教材名称</th><th>作者</th><th>出版社</th><th>ISBN</th><th>课程</th><th class="num">数量</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </details>`;
  });
  html += '</div>';
  box.innerHTML = html;
}

$('btnGen').onclick = renderResult;

/* ---------- 导出 CSV ---------- */
$('btnCsv').onclick = () => {
  const summary = buildSummary();
  if (!summary) return;
  const q = s => '"' + String(s ?? '').replace(/"/g,'""') + '"';
  const lines = [['教材名称','作者','出版社','ISBN','课程','备注','专业×数量','合计册数'].map(q).join(',')];
  summary.forEach(b=>{
    lines.push([b.name,b.author,b.pub,b.isbn,b.courses.join('、'),b.remark,
      b.majors.map(x=>`${x.m}×${x.qty}`).join('；'),b.total].map(q).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '2026级教材汇总.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('btnPrint').onclick = () => {
  document.querySelectorAll('.major-detail').forEach(d=>{ if(!d.open) d.open = true; });
  window.print();
};

renderMajors();
</script>
</body>
</html>
